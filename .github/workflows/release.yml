name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
      # Recovery path for a release whose npm/PyPI publication failed after the
      # GitHub release went public — both registries can only be reached from
      # this workflow, since their trusted publishers name release.yml. Skipping
      # the draft/undraft cycle matters: re-running it would hide the live
      # release's assets until the run finished.
      publish_only:
        description: 'Re-publish to npm and PyPI only; skip builds, the release and the other registries'
        required: false
        default: false
        type: boolean
      # The node addons take ~35 min to rebuild and the publish step then skips
      # every already-published version, so a PyPI-only recovery should not pay
      # for them.
      skip_npm:
        description: 'Also skip the npm publish (use when only PyPI needs re-publishing)'
        required: false
        default: false
        type: boolean
      # The preflight jobs assert things no build can assert for us, but they
      # lean on registry endpoints that are not all formally specified. If one
      # ever misfires, this gets a release out without waiting for a fix.
      skip_preflight:
        description: 'Skip the registry preflight checks'
        required: false
        default: false
        type: boolean

env:
  IMAGE_NAME: marcomq/mq-bridge-app
  IBM_MQ_SHA256: faadc63c7a0d7ae24a85cdb0ed5f0669a61c5f70123bbd3cea3c540c77eea855
  # Keyed on this, not the release version: a per-version scope meant every
  # release started from a cold Rust build. Bump it by hand to force a rebuild.
  # Caveat: GHA caches are ref-scoped, so a tag-push run reads main's cache but
  # writes its own -- dispatch-from-main runs get the full benefit.
  DOCKER_CACHE_VERSION: "1"

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      cargo_version: ${{ steps.meta.outputs.cargo_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Resolve tag and version
        id: meta
        shell: bash
        env:
          # Passed through the environment rather than interpolated into the
          # script body, so a dispatch input cannot inject shell.
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${INPUT_TAG:-$REF_NAME}"
          # Extract version from Cargo.toml, handling potential indentation
          CARGO_VERSION="$(sed -n 's/^[[:space:]]*version = "\([^"]*\)".*/\1/p' Cargo.toml | tr -d '\r' | head -n1)"
          # Fallback to the release tag (without 'v' prefix) if Cargo.toml version extraction fails
          if [ -z "$CARGO_VERSION" ]; then
            CARGO_VERSION="${RELEASE_TAG#v}"
          fi
          if [ "$RELEASE_TAG" != "v$CARGO_VERSION" ]; then
            echo "release tag $RELEASE_TAG does not match workspace version v$CARGO_VERSION" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *rc* || "$RELEASE_TAG" == *alpha* || "$RELEASE_TAG" == *beta* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "cargo_version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  # Every registry this workflow publishes to authenticates by OIDC, and none of
  # them can be checked without actually asking for a token. Asking up front
  # costs ~20s and converts the failure this pipeline is worst at -- 90 minutes
  # of builds, then a rejection on identity -- into an immediate one. These run
  # on `publish_only` too: that is the recovery path, so it is exactly when the
  # identity is most likely to be the thing that is broken.
  #
  # One job per environment, because a job has only one and the token's claims
  # must match what each registry registered:
  #   npm       - no environment (publish-node.yml's publish job has none)
  #   PyPI      - environment: pypi
  #   crates.io - environment: release
  preflight-npm:
    name: Preflight / npm
    needs: metadata
    if: ${{ !inputs.skip_preflight && !inputs.skip_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      # Replays what `npm publish` does internally (npm/lib/utils/oidc.js): mint
      # a GitHub id_token for the npm audience, then trade it for a publish token
      # per package. npm matches the trusted publisher on the *calling* workflow,
      # which is release.yml both here and at publish time, so this is the same
      # exchange the real upload will make. A package with no publisher, or one
      # registered against the wrong workflow, refuses the exchange here instead
      # of silently yielding no token and 404-ing on the PUT 90 minutes later.
      - name: npm trusted publishing
        env:
          VERSION: ${{ needs.metadata.outputs.cargo_version }}
        run: |
          set -euo pipefail
          id_token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          # Derived from the package manifest, not a second hardcoded list, so a
          # newly added platform target cannot slip past this check.
          mapfile -t packages < <(python3 -c '
          import json
          d = json.load(open("node/mq-bridge-node/package.json"))
          print(d["name"])
          for name in d.get("optionalDependencies", {}):
              print(name)
          ')
          echo "checking ${#packages[@]} npm packages"

          failed=()
          for pkg in "${packages[@]}"; do
            # The exchange answers 201 Created, not 200, so the status alone is
            # the wrong signal — assert on the minted token instead, which is
            # what `npm publish` actually consumes.
            body="$(curl -sS -o - -w '\n%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg")"
            code="${body##*$'\n'}"
            token="$(printf '%s' "${body%$'\n'*}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token") or "")' 2>/dev/null || true)"
            if [ -n "$token" ]; then
              echo "  ok       $pkg"
            else
              echo "  REFUSED  $pkg (HTTP $code, no token)"
              failed+=("$pkg")
            fi
            # Informational only: `publish_only` re-runs deliberately, and the
            # publish script skips versions that are already live.
            if curl -sSf -o /dev/null "https://registry.npmjs.org/$pkg/$VERSION" 2>/dev/null; then
              echo "  note     $pkg@$VERSION is already published; it will be skipped"
            fi
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::npm refused an OIDC publish token for: ${failed[*]}"
            echo "::error::Each package needs a trusted publisher on npmjs.com naming this repo and release.yml (not publish-node.yml). A brand-new platform package has to be bootstrapped once with a token before a publisher can be attached."
            exit 1
          fi

  # Not a registry, and deliberately not a step of preflight-npm: the tap has
  # nothing to do with npm, and hanging it off `skip_npm` meant a release
  # dispatched with skip_npm still ran update-homebrew-tap with an unverified
  # key. Gated like the tap job itself, which `publish_only` skips.
  preflight-homebrew:
    name: Preflight / Homebrew tap
    needs: metadata
    if: ${{ !inputs.skip_preflight && !inputs.publish_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A deploy key that was rotated or removed only shows up at the very end of
      # the run otherwise, after the release is already public.
      - name: Homebrew tap deploy key
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          # A greeting only proves the key is *a* valid key: a read-only or
          # foreign deploy key greets just as warmly. Ask the tap for the
          # service a push opens instead; stdin is closed, so nothing is written.
          probe="$(ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o BatchMode=yes \
            git@github.com "git-receive-pack 'marcomq/homebrew-tap.git'" </dev/null 2>&1 \
            | tr -d '\0' || true)"
          # The ref advertisement is binary; match a capability, don't print it.
          case "$probe" in
            *report-status*) echo "tap deploy key can write to marcomq/homebrew-tap" ;;
            *)
              echo "$probe"
              echo "::error::The Homebrew tap deploy key cannot write to marcomq/homebrew-tap (missing, revoked, or read-only)"
              exit 1
              ;;
          esac

  preflight-pypi:
    name: Preflight / PyPI
    needs: metadata
    if: ${{ !inputs.skip_preflight }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Must match the upload job's environment: PyPI matches the environment
    # claim, so a token minted outside it is not the token that will be used.
    environment:
      name: pypi
    steps:
      # PyPI's documented dry run for trusted publishing: mint an id_token for
      # PyPI's audience and exchange it. A non-200 is the same rejection the
      # upload would have hit at the end of the run. A 200 proves this workflow
      # is a registered publisher for at least one project -- PyPI mints a token
      # scoped to whatever it matches -- so it catches a wrong or missing
      # registration, not a second project that was never registered.
      - name: PyPI trusted publishing
        run: |
          set -euo pipefail
          audience="$(curl -sSf https://pypi.org/_/oidc/audience \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["audience"])')"
          id_token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          # The success body carries a real publish token, so only the status is
          # inspected on success and only `.message` is echoed on failure.
          code="$(curl -sS -o "$RUNNER_TEMP/pypi.json" -w '%{http_code}' \
            -X POST https://pypi.org/_/oidc/mint-token \
            --json "$(python3 -c 'import json,sys; print(json.dumps({"token": sys.argv[1]}))' "$id_token")")"
          if [ "$code" = "200" ]; then
            echo "PyPI trusted publisher OK"
            exit 0
          fi
          echo "::error::PyPI refused this workflow's OIDC identity (HTTP $code)"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("message", d))' \
            "$RUNNER_TEMP/pypi.json" >&2 || true
          echo "::error::Every mq-bridge-py* project needs a trusted publisher naming this repo, release.yml and the pypi environment. Note that PyPI matches the reusable workflow but verifies attestations against the caller, which is why the upload lives in release.yml."
          exit 1

  preflight-crates-io:
    name: Preflight / crates.io
    needs: metadata
    if: ${{ !inputs.skip_preflight && !inputs.publish_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: release
    steps:
      # The same OIDC exchange the publish job makes. It proves this workflow is
      # a registered Trusted Publisher on crates.io; it does not enumerate the
      # three crates, so it catches a revoked or misnamed registration rather
      # than one crate that was never set up.
      - name: crates.io trusted publishing
        uses: rust-lang/crates-io-auth-action@v1

  # A single gate the expensive jobs can hang off. The legs are individually
  # skippable (skip_npm, publish_only, skip_preflight), and a skipped `needs`
  # would skip every dependent, so this collapses them into one always-running
  # job that is green when nothing was actually refused.
  preflight:
    name: Preflight
    needs: [preflight-npm, preflight-pypi, preflight-crates-io, preflight-homebrew]
    # `!cancelled()`, not `always()`: a cancelled run would otherwise stack a red
    # "a preflight check failed" on top of the cancellation it is just observing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect preflight results
        env:
          NPM: ${{ needs.preflight-npm.result }}
          PYPI: ${{ needs.preflight-pypi.result }}
          CRATES: ${{ needs.preflight-crates-io.result }}
          HOMEBREW: ${{ needs.preflight-homebrew.result }}
        run: |
          set -euo pipefail
          status=0
          for leg in "npm:$NPM" "pypi:$PYPI" "crates-io:$CRATES" "homebrew:$HOMEBREW"; do
            echo "${leg%%:*}: ${leg#*:}"
            case "${leg#*:}" in
              success|skipped) ;;
              *) status=1 ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::A registry preflight check failed. Nothing has been built or published yet -- fix the trusted publisher registration and re-run. To release anyway, dispatch with skip_preflight."
            exit 1
          fi


  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    needs: metadata
    # Root of everything except the npm/PyPI publishers: skipping these three
    # cascades to every build, the release and the other registries.
    if: ${{ !inputs.publish_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zlib1g-dev cmake libcurl4-openssl-dev protobuf-compiler

      # Not --all-targets: it selects the benches as well, and `cargo test` runs
      # a criterion bench in test mode, so performance_bench would start its
      # Docker services and measure throughput here. Benches are only
      # compile-checked.
      - name: Test mq-bridge
        run: |
          cargo test -p mq-bridge --lib --bins --tests --features full
          cargo check -p mq-bridge --benches --features full

      - name: Test mq-bridge-app
        run: cargo test --manifest-path apps/mq-bridge-app/Cargo.toml -p mq-bridge-app --all-targets

  # Runs the exact app gate that PRs run (app.yml), so a tag cannot publish an
  # app that was never checked. Reused rather than copied so the two cannot drift.
  app-checks:
    name: App Checks
    needs: metadata
    if: ${{ !inputs.publish_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/app.yml

  package-dry-run:
    name: Cargo Package Dry Run
    runs-on: ubuntu-latest
    needs: metadata
    if: ${{ !inputs.publish_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zlib1g-dev cmake libcurl4-openssl-dev protobuf-compiler

      # The workspace [patch.crates-io] keeps every crate on this engine
      # instance locally, but patches are ignored for published consumers. If the
      # graph ever resolves two mq-bridge versions, extension factories register
      # into two different global registries and endpoints silently disappear.
      # `cargo tree --duplicates` is an inverted tree of every duplicated crate,
      # so mq-bridge shows up in it as an ancestor either way. Count distinct
      # resolved versions instead.
      - name: Assert a single mq-bridge instance
        run: |
          set -euo pipefail
          # Written outside the checkout: a stray file in the working tree makes
          # the `cargo package` step below fail on a dirty repository.
          cargo metadata --manifest-path apps/mq-bridge-app/Cargo.toml --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - <<'EOF'
          import json, os, sys
          meta = json.load(open(os.environ["RUNNER_TEMP"] + "/metadata.json"))
          versions = sorted({p["version"] for p in meta["packages"] if p["name"] == "mq-bridge"})
          print("mq-bridge versions in the graph:", versions)
          if len(versions) > 1:
              sys.exit("more than one mq-bridge instance: extension factories would "
                       "register into separate global registries")
          EOF

      # Each crate can only be dry-run as far as its dependencies are already on
      # crates.io, and this runs before anything is published:
      #   mq-bridge        - every dep is published, so the tarball builds.
      #   app-core         - depends on the unpublished mq-bridge at this version.
      #   mq-bridge-app    - the same, through app-core.
      # `cargo package` always re-resolves the packaged Cargo.lock against the real
      # index with [patch.crates-io] dropped, and --no-verify skips the build but
      # not that resolve, so both app crates can only be checked as far as --list:
      # manifest validity and file list. The real ordering guarantee is in
      # publish-crates-io, which publishes in dependency order and waits for the
      # index between crates.
      - name: Package publishable crates
        run: |
          cargo package -p mq-bridge
          cargo package --manifest-path apps/mq-bridge-app/Cargo.toml --list -p mq-bridge-app-core > /dev/null
          cargo package --manifest-path apps/mq-bridge-app/Cargo.toml --list -p mq-bridge-app > /dev/null

  # Created as a draft: assets are staged onto it by the build jobs, and it is
  # only made public by `publish-release` once every one of them has succeeded.
  # A failed CLI or bundle build must not leave an empty release behind.
  release:
    name: Create Draft Release
    needs: [metadata, preflight, test, app-checks, package-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: Release ${{ needs.metadata.outputs.release_tag }}
          # No hardcoded body: it would overwrite notes written by hand on a
          # pre-created release. Let GitHub generate notes when there are none.
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}

  build-release:
    name: Build CLI asset for ${{ matrix.target }}
    needs: [metadata, release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built natively rather than via `cross`: the cross 0.2.5 image is
          # Ubuntu 16.04 (OpenSSL 1.0.2), which openssl-sys rejects, and the
          # newer cross image is Ubuntu 24.04 -- a worse glibc floor than this.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: mq-bridge-app
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: mq-bridge-app
            use_cross: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary_name: mq-bridge-app.exe
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zlib1g-dev cmake libcurl4-openssl-dev protobuf-compiler

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config openssl@3 protobuf

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --manifest-path apps/mq-bridge-app/Cargo.toml --release --target ${{ matrix.target }} -p mq-bridge-app
          else
            cargo build --manifest-path apps/mq-bridge-app/Cargo.toml --release --target ${{ matrix.target }} -p mq-bridge-app
          fi

      - name: Package artifacts
        shell: bash
        run: |
          ASSET_NAME="mq-bridge-cli-${{ matrix.target }}"
          mkdir staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" staging/
          # The `mqb` launcher ships alongside the real binary so tarball and
          # Homebrew installs get the short command too, same as `cargo install`.
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp "target/${{ matrix.target }}/release/mqb.exe" staging/
          else
            cp "target/${{ matrix.target }}/release/mqb" staging/
          fi
          cp apps/mq-bridge-app/LICENSE apps/mq-bridge-app/README.md apps/mq-bridge-app/crates/core/THIRD_PARTY_LICENSES.txt staging/
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "${ASSET_NAME}.zip" ./staging/*
            echo "ASSET_PATH=${ASSET_NAME}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${ASSET_NAME}.tar.gz" -C staging .
            echo "ASSET_PATH=${ASSET_NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          files: ${{ env.ASSET_PATH }}

  build-linux-amd64:
    name: Build docker linux/amd64
    needs: [metadata, preflight, test, app-checks, package-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mq-bridge-app (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/mq-bridge-app/Dockerfile
          platforms: linux/amd64
          target: final
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:amd64
            ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.cargo_version }}-amd64
          build-args: |
            CACHE_BUST=${{ env.DOCKER_CACHE_VERSION }}
            ENABLE_IBM_MQ=false
          cache-from: type=gha,scope=build-amd64-v${{ env.DOCKER_CACHE_VERSION }}
          cache-to: type=gha,mode=max,scope=build-amd64-v${{ env.DOCKER_CACHE_VERSION }}

  build-linux-arm64:
    name: Build docker linux/arm64
    needs: [metadata, preflight, test, app-checks, package-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mq-bridge-app (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/mq-bridge-app/Dockerfile
          platforms: linux/arm64
          target: final
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:arm64
            ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.cargo_version }}-arm64
          build-args: |
            CACHE_BUST=${{ env.DOCKER_CACHE_VERSION }}
            ENABLE_IBM_MQ=false
          cache-from: type=gha,scope=build-arm64-v${{ env.DOCKER_CACHE_VERSION }}
          cache-to: type=gha,mode=max,scope=build-arm64-v${{ env.DOCKER_CACHE_VERSION }}

  build-linux-amd64-ibm-mq:
    name: Build docker linux/amd64 + IBM MQ
    needs: [metadata, preflight, test, app-checks, package-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mq-bridge-app (amd64 + IBM MQ)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/mq-bridge-app/Dockerfile
          platforms: linux/amd64
          target: final
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:amd64-ibm-mq
            ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.cargo_version }}-amd64-ibm-mq
          build-args: |
            CACHE_BUST=${{ env.DOCKER_CACHE_VERSION }}
            ENABLE_IBM_MQ=true
            IBM_MQ_SHA256=${{ env.IBM_MQ_SHA256 }}
          cache-from: type=gha,scope=build-amd64-ibm-mq-v${{ env.DOCKER_CACHE_VERSION }}
          cache-to: type=gha,mode=max,scope=build-amd64-ibm-mq-v${{ env.DOCKER_CACHE_VERSION }}

  publish-manifest:
    name: Push multi-arch manifest
    needs: [metadata, build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` keeps pointing at the last stable release: an rc/alpha/beta tag
      # publishes only its own version tag.
      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ needs.metadata.outputs.cargo_version }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
        run: |
          tags=(--tag "ghcr.io/${IMAGE_NAME}:${VERSION}")
          if [ "$IS_PRERELEASE" != "true" ]; then
            tags+=(--tag "ghcr.io/${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "ghcr.io/${IMAGE_NAME}:${VERSION}-amd64" \
            "ghcr.io/${IMAGE_NAME}:${VERSION}-arm64"

  publish-amd64-ibm-mq-tag:
    name: Push amd64 IBM MQ aliases
    needs: [metadata, build-linux-amd64-ibm-mq]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push IBM MQ image aliases
        env:
          VERSION: ${{ needs.metadata.outputs.cargo_version }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
        run: |
          tags=(--tag "ghcr.io/${IMAGE_NAME}:ibm-mq")
          if [ "$IS_PRERELEASE" != "true" ]; then
            tags+=(--tag "ghcr.io/${IMAGE_NAME}:latest-ibm-mq")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "ghcr.io/${IMAGE_NAME}:${VERSION}-amd64-ibm-mq"

  build-tauri-release:
    name: Build Tauri bundle for ${{ matrix.name }}
    needs: [metadata, release]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --config tauri.release.conf.json
          - name: windows
            platform: windows-2022
            rust_targets: ''
            tauri_args: --config tauri.release.conf.json
          - name: linux
            platform: ubuntu-22.04
            rust_targets: ''
            tauri_args: --config tauri.release.conf.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/mq-bridge-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # dtolnay/rust-toolchain caches nothing, so these bundles rebuilt the whole
      # dependency graph every release. rust-cache prunes workspace crates before
      # saving, so an entry stays around 1GB per platform -- watch the repo's 10GB
      # cache budget, which the docker buildx scopes also draw on.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/mq-bridge-app
          key: tauri-${{ matrix.name }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler libssl-dev pkg-config

      # protoc is required by the `pulsar` build script on every platform.
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - name: Install frontend dependencies
        working-directory: apps/mq-bridge-app
        run: npm ci

      - name: Enable Tauri bundling for release builds
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'apps/mq-bridge-app/crates/desktop/tauri.release.conf.json';
          const config = JSON.parse(fs.readFileSync('apps/mq-bridge-app/crates/desktop/tauri.conf.json', 'utf8'));
          // In Tauri v2, productName is a top-level property
          config.productName = "mq-bridge";
          // Sync the version with the release metadata to ensure correct artifact naming
          config.version = "${{ needs.metadata.outputs.cargo_version }}";
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          EOF

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/mq-bridge-app/crates/desktop
          releaseId: ${{ needs.release.outputs.release_id }}
          tagName: ${{ needs.metadata.outputs.release_tag }}
          uploadPlainBinary: false
          args: ${{ matrix.tauri_args }}

  # The single point where the release becomes public. Everything above stages
  # artifacts onto the draft; if any of it fails, the tag is left with a draft
  # that can be deleted, not a published release missing half its downloads.
  # Everything that publishes to an external registry hangs off this job.
  publish-release:
    name: Publish GitHub Release
    needs:
      - metadata
      - build-release
      - build-linux-arm64-asset
      - build-tauri-release
      - publish-manifest
      - publish-amd64-ibm-mq-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  # crates.io publication is irreversible, so it waits until every build has
  # succeeded and the release is live.
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [metadata, publish-release]
    environment: release
    permissions:
      # Required for crates.io Trusted Publishing (OIDC).
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          # Publishing uses CARGO_REGISTRY_TOKEN, not the GitHub token, so avoid
          # persisting git credentials for this job.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish` verifies the tarball by building it, so this job needs
      # the same system dependencies as the test job.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zlib1g-dev cmake libcurl4-openssl-dev protobuf-compiler

      # Exchange the GitHub OIDC token for a short-lived crates.io token.
          # All three crates below must each have a Trusted Publisher registered on crates.io.
      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        shell: bash
        run: |
          set -o pipefail
          # Tolerate a re-run where this version is already live, but fail on
          # anything else -- a swallowed error here surfaces later as a
          # confusing "no matching version" failure on the dependent crate.
          publish() {
            for attempt in 1 2 3 4 5; do
              cargo publish -p "$1" ${2:+--manifest-path "$2"} 2>&1 | tee "publish-$1.log" && return
              if grep -Eq "already uploaded|already exists on crates.io index" "publish-$1.log"; then
                echo "$1 is already on crates.io, continuing"
                return
              fi
              [ "$attempt" = 5 ] && return 1
              echo "publish of $1 failed; waiting for registry propagation"
              sleep 20
            done
          }
          publish mq-bridge
          publish mq-bridge-app-core apps/mq-bridge-app/Cargo.toml
          publish mq-bridge-app apps/mq-bridge-app/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The addon and wheel builds hang off the test gate, not off publish-release.
  # Nothing in them touches a registry, so there was never a reason to wait ~45min
  # for the docker images and desktop bundles first -- that serialisation was the
  # single biggest item on the critical path. The uploads below still wait for
  # publish-release, so the contract that nothing goes public until every build
  # has passed is unchanged; the cost is that a run which fails late has already
  # paid for these builds.
  build-node-packages:
    name: Build Node Packages
    needs: [metadata, preflight, test, app-checks, package-dry-run]
    # `publish_only` skips the test gate, and a skipped dependency skips the
    # dependent unless the condition tolerates it. The addons still have to be
    # rebuilt on that path: publish-node.yml only consumes artifacts from its
    # own run.
    #
    # `preflight` is checked explicitly. Tolerating a skipped `needs` opts this
    # job out of the default "skip when a dependency failed" rule for ALL of
    # them, so without this a refused preflight still paid for the full matrix --
    # and on `publish_only`, where the test gate is short-circuited, still
    # published.
    if: >-
      ${{ !cancelled() && !inputs.skip_npm
          && needs.preflight.result == 'success'
          && (inputs.publish_only
              || (needs.test.result == 'success'
                  && needs.app-checks.result == 'success'
                  && needs.package-dry-run.result == 'success')) }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-node.yml

  build-python-packages:
    name: Build Python Packages
    needs: [metadata, preflight, test, app-checks, package-dry-run]
    # See build-node-packages: `preflight` has to be named explicitly, because
    # tolerating a skipped `needs` waives the default failure-skip for every one.
    if: >-
      ${{ !cancelled()
          && needs.preflight.result == 'success'
          && (inputs.publish_only
              || (needs.test.result == 'success'
                  && needs.app-checks.result == 'success'
                  && needs.package-dry-run.result == 'success')) }}
    permissions:
      contents: read
      # GitHub validates the maximum permissions of every job in a reusable
      # workflow before evaluating job-level conditions. publish-python.yml's
      # manual-only publisher requests OIDC, even though it is skipped here.
      id-token: write
    uses: ./.github/workflows/publish-python.yml
    with:
      # Already the workflow_call default; stated anyway because getting it wrong
      # uploads with the caller's attestation identity, which PyPI rejects, and
      # that is exactly the failure that cost a full release run before.
      skip_publish: true

  # Deliberately NOT gated on publish-release: the conda matrix takes ~33 min
  # (win-64), which fits entirely inside the ~35 min node macOS build already on
  # the critical path. Only the upload below waits for the release to go public.
  build-conda-packages:
    name: Build Conda Packages
    needs: [metadata, preflight, test, app-checks, package-dry-run]
    # See build-node-packages: `preflight` has to be named explicitly, because
    # tolerating a skipped `needs` waives the default failure-skip for every one.
    if: >-
      ${{ !cancelled()
          && !inputs.publish_only
          && needs.preflight.result == 'success'
          && needs.test.result == 'success'
          && needs.app-checks.result == 'success'
          && needs.package-dry-run.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/conda.yml

  # Anaconda.org uploads are irreversible, so this waits for the release to be
  # public. It only downloads and uploads prebuilt artifacts, so it costs ~1 min.
  publish-conda:
    name: Publish Conda Packages
    needs: [build-conda-packages, publish-release]
    if: >-
      ${{ !cancelled()
          && needs.build-conda-packages.result == 'success'
          && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: mq-bridge-app-*
          path: conda-packages

      - name: Upload to Anaconda.org
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [ -z "$ANACONDA_API_TOKEN" ]; then
            echo "::warning::ANACONDA_API_TOKEN is not configured; packages were built but not published"
            exit 0
          fi
          pipx install --include-deps anaconda-client
          find conda-packages -type f -name '*.conda' -print0 \
            | xargs -0 anaconda --token "$ANACONDA_API_TOKEN" upload --user marcomq --label main

  publish-node:
    name: Publish Node Packages
    needs: [build-node-packages, publish-release]
    if: >-
      ${{ !cancelled() && !inputs.skip_npm
          && needs.build-node-packages.result == 'success'
          && (inputs.publish_only || needs.publish-release.result == 'success') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-node.yml
    secrets: inherit

  # The upload stays here, not in publish-python.yml: attestations are signed
  # with the top-level workflow's identity, so only a job in release.yml can
  # match the `release.yml` trusted publisher registered on PyPI.
  publish-python:
    name: Publish Python Packages / Publish to PyPI
    needs: [preflight, build-python-packages, publish-release]
    # Deliberately `!= 'failure'` rather than `== 'success'`. Two things can make
    # a dependency non-success here and only one is a real problem: a skip
    # propagates down the whole chain, and a reusable-workflow caller whose child
    # job was skipped may not report plain success either. Gate on publish-release
    # for the ordering guarantee instead, and let a genuine wheel failure skip us.
    #
    # That tolerance is why `preflight` needs its own `== 'success'`: a preflight
    # refusal skips build-python-packages, which `!= 'failure'` would wave through
    # to an upload with the identity preflight just said was wrong.
    if: >-
      ${{ !cancelled()
          && needs.preflight.result == 'success'
          && needs.build-python-packages.result != 'failure'
          && (inputs.publish_only || needs.publish-release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distributions
        uses: actions/download-artifact@v8
        with:
          pattern: sdist-*
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: List distribution files
        run: ls -lh dist/

      - name: Check package metadata
        run: |
          pip install twine
          twine check dist/*

      # One upload per project. PyPI mints an OIDC token scoped to the projects
      # this identity is a registered publisher for, so a single mixed upload
      # fails halfway with a 403 naming a project rather than telling you which
      # registration is missing.
      - name: Split distributions by project
        run: |
          set -euo pipefail
          mkdir -p dist/mq-bridge-py dist/mq-bridge-py-basic
          mv dist/mq_bridge_py_basic-* dist/mq-bridge-py-basic/
          mv dist/mq_bridge_py-* dist/mq-bridge-py/
          for d in dist/mq-bridge-py dist/mq-bridge-py-basic; do
            [ -n "$(ls -A "$d")" ] || { echo "::error::no distributions for $d"; exit 1; }
          done
          ls -lh dist/mq-bridge-py dist/mq-bridge-py-basic

      # skip-existing keeps a partial upload retryable: without it, re-publishing
      # after one project was refused dies on the other's duplicate files.
      - name: Publish mq-bridge-py to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/mq-bridge-py/
          skip-existing: true

      - name: Publish mq-bridge-py-basic to PyPI
        if: ${{ !cancelled() }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/mq-bridge-py-basic/
          skip-existing: true

  update-homebrew-tap:
    name: Update Homebrew tap
    # render.sh streams the CLI tarballs and the Tauri .dmg to compute their
    # sha256, and a draft release's assets have no public download URL — so this
    # waits for the release to be undrafted, not just for the builds.
    needs: [metadata, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}
          # The tap is cloned and pushed over SSH (GIT_SSH_COMMAND + deploy key),
          # so the checkout token has no reason to persist in .git/config.
          persist-credentials: false

      - name: Render formula + cask from release assets
        env:
          VERSION: ${{ needs.metadata.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: apps/mq-bridge-app/packaging/homebrew/render.sh "$VERSION" "$REPO" out

      - name: Push to tap
        # Auth via an SSH deploy key on marcomq/homebrew-tap (write-enabled).
        # HOMEBREW_TAP_DEPLOY_KEY holds the PRIVATE key; the matching public key
        # is registered as a deploy key on the tap. Deploy keys don't expire, so
        # there's no yearly token rotation to break this job.
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.metadata.outputs.release_tag }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:marcomq/homebrew-tap.git tap
          mkdir -p tap/Formula tap/Casks
          cp out/Formula/mq-bridge-app.rb tap/Formula/mq-bridge-app.rb
          cp out/Casks/mq-bridge.rb       tap/Casks/mq-bridge.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mq-bridge-app.rb Casks/mq-bridge.rb
          # An empty staging area is the only legitimate no-op here; any other
          # commit failure must fail the job instead of skipping the push.
          if git diff --cached --quiet; then
            echo "tap already up to date for ${VERSION}"
            exit 0
          fi
          git commit -m "mq-bridge ${VERSION}"
          git push

  publish-mcp-registry:
    name: Publish to MCP Registry
    # The registry validates that every package in server.json actually exists
    # and carries the ownership marker, so both the ghcr manifest and the
    # crates.io release must land first.
    needs: [metadata, publish-manifest, publish-crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for `mcp-publisher login github-oidc`.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Pin server.json to the release version
        env:
          VERSION: ${{ needs.metadata.outputs.cargo_version }}
        run: |
          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          path = "apps/mq-bridge-app/server.json"
          with open(path) as f:
              server = json.load(f)
          server["version"] = version
          for pkg in server.get("packages", []):
              if pkg["registryType"] == "oci":
                  pkg["identifier"] = pkg["identifier"].rsplit(":", 1)[0] + ":" + version
              else:
                  pkg["version"] = version
          with open(path, "w") as f:
              json.dump(server, f, indent=2)
              f.write("\n")
          PY
          cat apps/mq-bridge-app/server.json

      - name: Install mcp-publisher
        env:
          # Pinned instead of `latest` so a compromised or simply changed
          # upstream release can't silently swap the publisher out from under
          # a job that holds an OIDC identity. Checksum is from
          # registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt of that release.
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish
        run: |
          mcp-publisher login github-oidc
          # The publisher reads this argument as a file path, not a directory.
          mcp-publisher publish apps/mq-bridge-app/server.json

  build-linux-arm64-asset:
    name: Extract linux/arm64 CLI asset
    # The arm64 binary is already cross-compiled by the docker job (the
    # Dockerfile carries the cmake/pkg-config toolchain that makes librdkafka
    # and OpenSSL build for aarch64). Rather than reproduce that with `cross`,
    # lift the finished binary out of the image that was just pushed.
    needs: [metadata, release, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A workflow_dispatch run defaults to the branch it was started from;
          # a release must be built from the tag it claims to be.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the binary from the arm64 image
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.cargo_version }}-arm64
        run: |
          # `create` + `cp` only unpack the filesystem, so no QEMU is needed to
          # pull a foreign-arch binary out of the image.
          docker pull --platform linux/arm64 "$IMAGE"
          CID="$(docker create --platform linux/arm64 "$IMAGE")"
          mkdir staging
          docker cp "$CID:/usr/local/bin/mq-bridge-app" staging/mq-bridge-app
          docker cp "$CID:/usr/local/bin/mqb" staging/mqb
          docker rm "$CID"
          file staging/mq-bridge-app

      - name: Package artifacts
        run: |
          cp apps/mq-bridge-app/LICENSE apps/mq-bridge-app/README.md apps/mq-bridge-app/crates/core/THIRD_PARTY_LICENSES.txt staging/
          tar -czf mq-bridge-cli-aarch64-unknown-linux-gnu.tar.gz -C staging .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          files: mq-bridge-cli-aarch64-unknown-linux-gnu.tar.gz

# The routes the Caller benchmark calls. Same Postgres as the other lookup benches
# (`docker compose up -d --wait` in benches/lookup).
#
# No `input` and no `output`: a Caller reads the calls itself and answers with the row.

# All calls waiting at the same moment become one `IN (…)` query.
users:
  batch_size: 256
  concurrency: 4
  input:
    middlewares:
      - lookup:
          from:
            sqlx:
              url: "postgres://localhost:55432/bench"
              table: users
              max_connections: 64
              lookup_query: "SELECT path, id, name, tier FROM users WHERE path IN (${payload:path})"
          into: $

# The same, with up to 16 batches in flight. The lanes share one pool (same URL and options),
# so at most 8 queries wait for Postgres at once.
users_parallel:
  batch_size: 256
  concurrency: 4
  input:
    middlewares:
      - lookup:
          from:
            sqlx:
              url: "postgres://localhost:55432/bench"
              table: users
              max_connections: 8
              lookup_query: "SELECT path, id, name, tier FROM users WHERE path IN (${payload:path})"
          into: $
      - parallel: { max_in_flight: 16 }

# The same with 32 lanes, sharing a pool of 4 connections.
users_parallel32:
  batch_size: 256
  concurrency: 4
  input:
    middlewares:
      - lookup:
          from:
            sqlx:
              url: "postgres://localhost:55432/bench"
              table: users
              max_connections: 4
              lookup_query: "SELECT path, id, name, tier FROM users WHERE path IN (${payload:path})"
          into: $
      - parallel: { max_in_flight: 32 }

# 8 lanes, with room for 4,096 waiting calls (the Caller default now).
users_parallel_cap:
  batch_size: 256
  concurrency: 4
  input:
    memory: { topic: users_parallel_cap, capacity: 4096 }
    middlewares:
      - lookup:
          from:
            sqlx:
              url: "postgres://localhost:55432/bench"
              table: users
              max_connections: 64
              lookup_query: "SELECT path, id, name, tier FROM users WHERE path IN (${payload:path})"
          into: $
      - parallel: { max_in_flight: 8 }

# 8 lanes, reading up to 512 calls per batch (the memory input stops filling at half).
users_parallel_b512:
  batch_size: 512
  concurrency: 4
  input:
    middlewares:
      - lookup:
          from:
            sqlx:
              url: "postgres://localhost:55432/bench"
              table: users
              max_connections: 64
              lookup_query: "SELECT path, id, name, tier FROM users WHERE path IN (${payload:path})"
          into: $
      - parallel: { max_in_flight: 8 }

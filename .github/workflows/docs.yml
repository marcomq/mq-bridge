name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "llms.txt"
      - "apps/mq-bridge-app/crates/cli/examples/gen_url_docs.rs"
      - ".github/workflows/docs.yml"
  # The benchmark workflow pushes new data to the gh-pages branch; republish the
  # site so the vendored dashboard below picks it up.
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Vendor engine docs
        run: bash docs/book/sync-engine-docs.sh

      - name: Build book
        run: mdbook build docs/book

      - name: Check internal links
        run: python3 docs/book/check-links.py

      # llms.txt lives at the repository root; publish it with the book.
      - name: Publish llms.txt
        run: cp llms.txt docs/book/book/llms.txt

      # Canonical URLs, meta descriptions, sitemap.xml and llms-full.txt.
      - name: Postprocess book
        run: python3 docs/book/postprocess.py

      # The benchmark dashboard lives on the gh-pages branch. Copy it into the
      # book so this workflow is the only thing that publishes to Pages.
      - name: Checkout benchmark data
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: .benchmark-data
          persist-credentials: false

      - name: Vendor benchmark dashboard
        run: |
          src=.benchmark-data/dev/bench
          if [ -d "$src" ]; then
            mkdir -p docs/book/book/dev
            cp -R "$src" docs/book/book/dev/bench
          else
            echo "::warning::no benchmark data on gh-pages; /dev/bench/ will be missing"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/book

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

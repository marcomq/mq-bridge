[package]
name = "caller-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mq-bridge = { path = "../../..", default-features = false, features = ["sqlx", "yaml"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros"] }
tokio = { version = "1", features = ["full"] }
async-graphql = { version = "7.2.1", default-features = false, features = ["dataloader", "tokio-timer"] }

[profile.release]
debug = "line-tables-only"

# Not part of the mq-bridge workspace.
[workspace]

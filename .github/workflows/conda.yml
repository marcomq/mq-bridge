name: Conda package

on:
  # An uncached release build on three platforms costs ~67 runner-minutes and
  # only smoke-tests `--version`. Source changes are covered by ci.yml; run it
  # on PRs only when the recipe or this workflow itself changes.
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/mq-bridge-app/packaging/conda/**'
      - '.github/workflows/conda.yml'
  # Called by release.yml. A `release: [published]` trigger was used here
  # before and never once fired: release.yml undrafts with GITHUB_TOKEN, and
  # GitHub does not start workflow runs from GITHUB_TOKEN-triggered events.
  workflow_call:
  workflow_dispatch:

concurrency:
  # Prefixed because `github.workflow` resolves to the *caller* under
  # workflow_call, which would otherwise share release.yml's group.
  group: conda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-64
            runner: ubuntu-22.04
          - target: osx-arm64
            runner: macos-14
          - target: win-64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve package version
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = fs.readFileSync('apps/mq-bridge-app/Cargo.toml', 'utf8');
          const version = manifest.match(/\[workspace\.package\][\s\S]*?^version = "([^"]+)"/m)?.[1];
          if (!version) throw new Error('workspace package version not found');
          fs.appendFileSync(process.env.GITHUB_ENV, `MQ_BRIDGE_VERSION=${version}\n`);
          NODE

      - name: Build, test, and retain conda package
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          recipe-path: apps/mq-bridge-app/packaging/conda/recipe.yaml
          build-args: --target-platform=${{ matrix.target }} -c conda-forge
          artifact-name: mq-bridge-app-${{ matrix.target }}

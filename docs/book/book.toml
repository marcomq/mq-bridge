[book]
title    = "mqb · mq-bridge"
authors  = ["mq-bridge contributors"]
language = "en"
src      = "."

[output.html]
default-theme      = "light"
preferred-dark-theme = "navy"
site-url           = "/mq-bridge/"
git-repository-url = "https://github.com/marcomq/mq-bridge"
edit-url-template  = "https://github.com/marcomq/mq-bridge/edit/main/docs/book/{path}"
additional-css     = ["theme/custom.css"]
additional-js      = ["theme/mermaid-init.js"]

[output.html.fold]
enable = true
level  = 1

[output.html.search]
enable = true

[output.html.playground]
runnable = false

# Old URL -> new page, relative to the old URL. Add an entry when a page moves or is
# renamed; README.md chapters render as index.html, so links to README.html land here.
[output.html.redirect]
"/use-cases/README.html"  = "index.html"
"/connectors/README.html" = "index.html"
"/reference/README.html"  = "index.html"

[build]
build-dir = "book"

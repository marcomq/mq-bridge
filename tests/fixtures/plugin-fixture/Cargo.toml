[package]
name = "mq-bridge-plugin-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "In-memory endpoint used to test the mq-bridge plugin ABI, loader and SDK"
license = "MIT OR Apache-2.0"

[lib]
# Both halves on purpose: the tests run the same endpoint linked directly and
# loaded through the plugin loader, and must see identical semantics.
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
mq-bridge = { path = "../../..", default-features = false, features = ["plugin-sdk"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
mq-bridge = { path = "../../..", default-features = false, features = ["plugin-sdk", "test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

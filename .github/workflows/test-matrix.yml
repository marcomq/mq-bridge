name: Test Matrix

on:
  push:
    branches: [main, dev]
    # The app lives in the same repo but cannot affect the engine crate. Its own
    # checks run in app.yml, which conversely *does* trigger on engine changes.
    paths-ignore:
      - 'apps/mq-bridge-app/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, dev]
    # The app lives in the same repo but cannot affect the engine crate. Its own
    # checks run in app.yml, which conversely *does* trigger on engine changes.
    paths-ignore:
      - 'apps/mq-bridge-app/**'
      - '.github/workflows/app.yml'
      - '.github/workflows/docs.yml'

# Superseded PR runs are cancelled; push runs always finish so every pre-merge
# commit keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} with Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this job writes back to the repository.
          persist-credentials: false
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-
      
      - name: Run tests
        run: cargo test --lib --features=full
      
      - name: Check build
        run: cargo build --features=full

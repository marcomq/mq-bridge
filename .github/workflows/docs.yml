name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "apps/mq-bridge-app/dev/docs/**"
      - "apps/mq-bridge-app/crates/cli/examples/gen_url_docs.rs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      - name: Vendor engine docs
        run: bash apps/mq-bridge-app/dev/docs/sync-engine-docs.sh

      - name: Build book
        run: mdbook build apps/mq-bridge-app/dev/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mq-bridge-app/dev/docs/book

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
# Same project NAME as the full wheel on purpose: this variant supplies the
# `mq-bridge-py` wheels for platforms where the `full` C toolchain doesn't build
# (musl/Alpine, Windows arm64). pip selects wheels by platform tag within a
# single project, so `pip install mq-bridge-py` gets the `full` wheel on
# glibc-Linux/macOS/Windows-x64 and this `basic` wheel on those targets,
# automatically. Kafka/sqlx/grpc/IBM-MQ-static are unavailable here (they fail
# to build on these targets); calling them raises a clear runtime error.
name = "mq-bridge-py"
# Version is read from Cargo.toml by maturin
dynamic = ["version"]
description = "Python bindings for mq-bridge (reduced-platform build — HTTP, NATS, MQTT, WebSocket, ZeroMQ, MongoDB, AMQP, AWS SQS/SNS; no Kafka)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typing-extensions>=4.0",
]
license = { text = "MIT OR Apache-2.0" }
license-files = ["LICENSE.python", "LICENSE-MIT.python", "LICENSE-APACHE.python", "THIRD_PARTY_LICENSES.txt"]
keywords = ["messaging", "tokio", "pyo3", "maturin", "mq-bridge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/marcomq/mq-bridge"
Repository = "https://github.com/marcomq/mq-bridge"
Issues = "https://github.com/marcomq/mq-bridge/issues"

[dependency-groups]
dev = [
  "maturin>=1.7,<2.0",
  "pytest>=8.3",
]
bench = [
  "aiohttp>=3.10",
  "fastapi>=0.115",
  "faststream>=0.6; python_version >= '3.10'",
  "sanic>=24.6",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
markers = [
  "performance: skipped-by-default benchmark smoke tests",
]

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module", "basic", "schema"]
module-name = "mq_bridge._mq_bridge"
python-source = "."

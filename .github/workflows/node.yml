name: Node

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/node.yml"
      - "node/mq-bridge-node/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/node.yml"
      - "node/mq-bridge-node/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  workflow_dispatch:

# Superseded PR runs are cancelled; push runs always finish so every pre-merge
# commit keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast guard: catches package.json/package-lock.json drift (e.g. a version
  # bump that only half-updates the lock) before it reaches the publish flow,
  # where `npm ci` fails after all the native builds have already run.
  lock-sync:
    name: package-lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node/mq-bridge-node/package-lock.json

      - name: Verify lock is in sync
        working-directory: node/mq-bridge-node
        run: npm ci --ignore-scripts

  test:
    name: Node binding smoke test
    runs-on: ubuntu-latest
    # Backstop only; the tests carry their own tighter cap. Keep this above a
    # cold-cache `cargo check` + `napi build`, which the step timeouts don't cover.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node/mq-bridge-node/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-node-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-cargo-

      - name: Install Node dependencies
        working-directory: node/mq-bridge-node
        run: npm ci

      - name: Check Rust binding
        run: cargo check -p mq-bridge-node --no-default-features --features "http middleware schema"

      - name: Build native addon
        working-directory: node/mq-bridge-node
        run: npm run build:ci

      # A leaked ThreadsafeFunction keeps the event loop alive and the suite
      # never exits; cap it here rather than burning the whole job budget.
      - name: Run Node tests
        working-directory: node/mq-bridge-node
        timeout-minutes: 5
        run: npm test

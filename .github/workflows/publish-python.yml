name: Publish Python Packages

# Invoked by release.yml after the GitHub release goes public. It deliberately
# does NOT listen on `release: published` any more: that made a second, unordered
# entry point into publication that the release orchestrator could not gate.
on:
  workflow_call:
    inputs:
      target:
        description: "Where to publish the packages"
        required: false
        default: "pypi"
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish the packages"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build-wheels:
    name: Build ${{ matrix.package }} wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: mq-bridge-py-basic
            pyproject: pyproject-basic.toml
            runner: ubuntu-latest
            os: linux
            target: x86_64
            args: --release --out dist --find-interpreter --no-default-features
          - package: mq-bridge-py-basic
            # Build the aarch64 basic wheel on a native arm64 runner to avoid
            # ring/aws-lc-sys cross-toolchain issues in manylinux containers.
            # If maturin's manylinux:auto still selects a container that
            # reintroduces those issues, pin manylinux to a specific version.
            pyproject: pyproject-basic.toml
            runner: ubuntu-24.04-arm
            os: linux
            target: aarch64
            args: --release --out dist --find-interpreter --no-default-features
          # musl/Alpine wheels for the basic package. basic uses the aws-lc-sys
          # crypto provider (amqp + aws pull it in, same as full); aws-lc-sys
          # compiles its C natively under musl given cmake + gcc, which
          # before-script-linux installs in the musllinux container. The full
          # wheel has no musl build (rdkafka makes it a separate effort).
          - package: mq-bridge-py-basic
            pyproject: pyproject-basic.toml
            runner: ubuntu-latest
            os: linux
            target: x86_64
            manylinux: musllinux_1_2
            args: --release --out dist --find-interpreter --no-default-features
          - package: mq-bridge-py-basic
            pyproject: pyproject-basic.toml
            runner: ubuntu-24.04-arm
            os: linux
            target: aarch64
            manylinux: musllinux_1_2
            args: --release --out dist --find-interpreter --no-default-features
          - package: mq-bridge-py-basic
            pyproject: pyproject-basic.toml
            runner: macos-15-intel
            os: macos
            target: x86_64
            args: --release --out dist --find-interpreter --no-default-features
          - package: mq-bridge-py-basic
            pyproject: pyproject-basic.toml
            runner: macos-latest
            os: macos
            target: aarch64
            args: --release --out dist --find-interpreter --no-default-features
          - package: mq-bridge-py-basic
            pyproject: pyproject-basic.toml
            runner: windows-latest
            os: windows
            target: x86_64
            args: --release --out dist --find-interpreter --no-default-features
          - package: mq-bridge-py
            pyproject: pyproject.toml
            runner: ubuntu-latest
            os: linux
            target: x86_64
            args: --release --out dist --find-interpreter
          - package: mq-bridge-py
            # Build the full wheel for aarch64 on a NATIVE arm64 runner rather
            # than cross-compiling from x86_64. The `full` feature pulls in
            # aws-lc-sys (BoringSSL C), which has no pre-built artifact and
            # fails to cross-compile in the manylinux container; building
            # natively makes it a plain native C compile. (The basic wheel uses
            # rustls-ring, which cross-compiles fine, so it stays on ubuntu-latest.)
            pyproject: pyproject.toml
            runner: ubuntu-24.04-arm
            os: linux
            target: aarch64
            args: --release --out dist --find-interpreter
          # Reduced-feature wheels published UNDER THE `mq-bridge-py` NAME so that
          # a single `pip install mq-bridge-py` resolves to the `full` wheel on
          # glibc-Linux/macOS/Windows-x64 and to this `basic`-featured wheel on
          # targets where the full C toolchain doesn't build (musl/Alpine,
          # Windows arm64), picked automatically by platform tag.
          # pyproject-reduced.toml keeps the `mq-bridge-py` project name but
          # compiles the `basic` feature set (no Kafka/sqlx/grpc/IBM-MQ-static).
          # Same aws-lc-sys-native setup as the mq-bridge-py-basic rows.
          - package: mq-bridge-py
            pyproject: pyproject-reduced.toml
            runner: ubuntu-latest
            os: linux
            target: x86_64
            manylinux: musllinux_1_2
            args: --release --out dist --find-interpreter --no-default-features
          - package: mq-bridge-py
            pyproject: pyproject-reduced.toml
            runner: ubuntu-24.04-arm
            os: linux
            target: aarch64
            manylinux: musllinux_1_2
            args: --release --out dist --find-interpreter --no-default-features
          # Windows arm64 gets the reduced set too: `basic` still pulls aws-lc-sys
          # (via amqp+aws), which compiles natively under MSVC on the native
          # windows-11-arm runner. If aws-lc-sys ever fails to build here, drop
          # amqp+aws from a Windows-arm-only feature set rather than reintroducing
          # a cross-compile.
          - package: mq-bridge-py
            pyproject: pyproject-reduced.toml
            runner: windows-11-arm
            os: windows
            target: aarch64
            args: --release --out dist --find-interpreter --no-default-features
          - package: mq-bridge-py
            pyproject: pyproject.toml
            runner: macos-15-intel
            os: macos
            target: x86_64
            args: --release --out dist --find-interpreter
          - package: mq-bridge-py
            pyproject: pyproject.toml
            runner: macos-latest
            os: macos
            target: aarch64
            args: --release --out dist --find-interpreter
          - package: mq-bridge-py
            pyproject: pyproject.toml
            runner: windows-latest
            os: windows
            target: x86_64
            args: --release --out dist --find-interpreter

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select package metadata
        if: matrix.pyproject != 'pyproject.toml'
        working-directory: python/mq-bridge-py
        shell: bash
        run: cp "${{ matrix.pyproject }}" pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # Work around intermittent "HTTP2 framing layer" curl errors when
          # cargo downloads crates inside the manylinux container.
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "5"
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          working-directory: python/mq-bridge-py
          command: build
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          sccache: "true"
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # amqp/aws (and full's kafka) pull aws-lc-sys, which compiles its C with
          # cmake. manylinux containers already ship it; the musllinux (Alpine)
          # container does not, so install it there. Guarded so it's a no-op
          # wherever cmake is already present. Only runs for linux builds.
          before-script-linux: |
            command -v cmake >/dev/null 2>&1 || apk add --no-cache cmake gcc g++ make musl-dev perl

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'auto' }}
          path: python/mq-bridge-py/dist

  build-sdists:
    name: Build ${{ matrix.package }} sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: mq-bridge-py-basic
            pyproject: pyproject-basic.toml
          - package: mq-bridge-py
            pyproject: pyproject.toml

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select package metadata
        if: matrix.pyproject != 'pyproject.toml'
        working-directory: python/mq-bridge-py
        run: cp "${{ matrix.pyproject }}" pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python/mq-bridge-py
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-${{ matrix.package }}
          path: python/mq-bridge-py/dist

  publish:
    name: Publish to ${{ inputs.target == 'pypi' && 'PyPI' || 'TestPyPI' }}
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdists]
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.target }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List distribution files
        run: ls -lh dist/

      - name: Check package metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

services:
  redis:
    image: redis:8.8-alpine

  # Any OpenAI-compatible chat API works; Ollama keeps the example offline.
  ollama:
    image: ollama/ollama:0.12.3
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  # Pulls the model, then exits.
  setup:
    image: curlimages/curl:8.10.1
    depends_on: [ollama]
    command:
      - sh
      - -c
      - |
        curl -sS --fail --retry 30 --retry-connrefused --retry-delay 1 \
          http://ollama:11434/api/pull -d '{"model": "qwen2.5:3b", "stream": false}'

  mq-bridge:
    image: ghcr.io/marcomq/mq-bridge-app:1.0.1
    command: ["--config", "/config/routes.yaml"]
    volumes: ["./routes.yaml:/config/routes.yaml:ro"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      redis: { condition: service_started }
      setup: { condition: service_completed_successfully }
    restart: on-failure

volumes:
  ollama:

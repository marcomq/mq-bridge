schema_version: 1

context:
  version: ${{ env.get("MQ_BRIDGE_VERSION") }}

package:
  name: mq-bridge-app
  version: ${{ version }}

# Build directly from the checked-out repository. For a conda-forge submission,
# replace this with the release archive URL and its sha256.
source:
  path: ../../../..
  use_gitignore: true

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: unix
        then:
          # conda's -O2 in CFLAGS* lands after aws-lc-sys' -O0 for jitterentropy, which
          # then refuses to compile; cc >=1.6 snapshots the env, defeating aws-lc-sys'
          # own override. cc still passes -O3 from the cargo profile.
          - for v in $(compgen -e | grep -E '^(HOST_|TARGET_)?CFLAGS'); do export "$v=$(printenv "$v" | sed -E 's/(^|[[:space:]])-O[0-9a-z]+//g')"; done
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path apps/mq-bridge-app/crates/cli
        else:
          # rattler-build >=0.68 puts CARGO_HOME under %SRC_DIR%, which pushes
          # aws-lc-sys' relative third_party includes past MAX_PATH -- cl.exe is
          # not long-path aware. %CD:~0,2% is the drive the build already runs on.
          - 'set CARGO_HOME=%CD:~0,2%\cargo'
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path apps/mq-bridge-app/crates/cli
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    # `compiler('c')` defaults to vs2017 on Windows, which the runners no longer
    # ship; its activation then leaves cl.exe off PATH and aws-lc-sys fails to build.
    - if: win
      then: vs2022_win-64
      else: ${{ compiler('c') }}
    - if: win
      then: rust >=1.94
      else: ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - cmake
    - ninja
    # protoc, required by the `pulsar` build script on every platform.
    - libprotobuf
    - if: unix
      then: pkg-config
  host:
    - if: unix
      then: openssl
    - if: unix
      then: zlib
    # librdkafka; matches the libcurl4-openssl-dev the release workflow installs.
    - if: linux
      then: libcurl
  run:
    - if: unix
      then: openssl
    - if: unix
      then: zlib
    - if: linux
      then: libcurl

tests:
  - script:
      - mq-bridge-app --version
      - mqb --version
      - mq-bridge-app --help
  - package_contents:
      bin:
        - mq-bridge-app
        - mqb
      strict: true

about:
  homepage: https://github.com/marcomq/mq-bridge
  repository: https://github.com/marcomq/mq-bridge
  documentation: https://marcomq.github.io/mq-bridge/
  summary: Universal, protocol-agnostic message and data bridge
  description: |
    mq-bridge-app is the headless CLI, server, and MCP server for mq-bridge.
    The package installs both the mq-bridge-app executable and the shorter mqb
    launcher. IBM MQ support requires an IBM MQ client library at runtime.
  license: MIT OR Apache-2.0
  license_file:
    - apps/mq-bridge-app/LICENSE
    - apps/mq-bridge-app/LICENSE-MIT
    - apps/mq-bridge-app/LICENSE-APACHE
    - apps/mq-bridge-app/crates/core/THIRD_PARTY_LICENSES.txt
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - marcomq

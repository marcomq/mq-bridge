[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mq-bridge"
# Version is read from Cargo.toml by maturin
dynamic = ["version"]
description = "Async ETL and messaging engine (Rust core): brokers (Kafka, NATS, AMQP, MQTT), databases incl. Postgres/MongoDB CDC, Parquet on S3/GCS/Azure object storage, HTTP/gRPC."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typing-extensions>=4.0",
]

license = { text = "MIT OR Apache-2.0" }
license-files = ["LICENSE.python", "LICENSE-MIT.python", "LICENSE-APACHE.python", "THIRD_PARTY_LICENSES.txt"]
keywords = [
  "messaging", "kafka", "nats", "amqp", "rabbitmq", "mqtt", "etl", "cdc", "postgres", "mongodb",
  "clickhouse", "parquet", "s3", "object-storage", "http", "grpc", "mq-bridge",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Database",
  "Topic :: System :: Networking",
  "Topic :: System :: Distributed Computing",
  "Topic :: Software Development :: Libraries",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
]

[project.optional-dependencies]
plugin-packaging = ["build>=1", "wheel>=0.45"]

[project.urls]
Homepage = "https://marcomq.github.io/mq-bridge/"
Documentation = "https://marcomq.github.io/mq-bridge/getting-started/library-quick-start.html"
Book = "https://marcomq.github.io/mq-bridge/"
Repository = "https://github.com/marcomq/mq-bridge"
Issues = "https://github.com/marcomq/mq-bridge/issues"

[dependency-groups]
dev = [
  "maturin>=1.7,<2.0",
  "pytest>=8.3",
]
bench = [
  "aiohttp>=3.10",
  "fastapi>=0.115",
  "faststream>=0.6; python_version >= '3.10'",
  "sanic>=24.6",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
markers = [
  "performance: skipped-by-default benchmark smoke tests",
]

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module", "full", "schema"]
module-name = "mq_bridge._mq_bridge"
# Editable installs (uv sync / uv run) build a debug extension, not a release one.
editable-profile = "dev"
python-source = "."

# Path-scoped: cargo finds this only when the build is started from inside
# apps/mq-bridge-app (npm run tauri, tauri-action's projectPath). Builds started
# from the repository root use /.cargo/config.toml instead, which is why
# CMAKE_ARGS is defined in both.
[env]
CMAKE_ARGS = "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

# Share the engine's target dir. Relative to this config's parent directory,
# so app-cwd builds write to <repo>/target rather than a second tree.
[build]
target-dir = "../../target"

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-no_compact_unwind"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-no_compact_unwind"]

# Override the inherited root aliases: the app crates have no `test-utils` feature.
[alias]
cf = "check --all-targets --features full"
tf = "test --features full"

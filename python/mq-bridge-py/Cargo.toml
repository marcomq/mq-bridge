[package]
name = "mq-bridge-py"
version.workspace = true
edition = "2021"
publish = false
description = "Python bindings for mq-bridge, an async message-bridging library"
license = "MIT"
repository = "https://github.com/marcomq/mq-bridge"

[lib]
name = "mq_bridge"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes = { workspace = true, features = ["serde"] }
fast-uuid-v7.workspace = true
mq-bridge = { path = "../..", features = ["schema"] }
mq-bridge-bindings-common = { path = "../../bindings-common" }
pyo3 = { version = "0.29.0", features = ["abi3-py38"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "logging"] }
schemars = "1.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter"] }

# The extension module is dlopen'd by CPython, so mimalloc's thread-locals must
# use the dynamic TLS model — the default initial-exec model draws from the fixed
# static TLS surplus and fails to load on slim images ("cannot allocate memory in
# static TLS block"). Not applicable on macOS/Windows.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"], optional = true }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }

# `auto-initialize` is only needed to embed the interpreter for the in-crate
# `cargo test` unit tests (`Python::attach`). It must NOT be enabled for the
# wheel/`--lib` build: manylinux ships a static-only Python, which PyO3 rejects
# when combined with `extension-module` + `auto-initialize`. Keeping it as a
# dev-dependency feature applies it to test/bench/example builds only.
[dev-dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py38", "auto-initialize"] }

[features]
default = ["full"]
# Testing-only middleware hooks; do not include this feature in production wheels.
middleware = ["mq-bridge/middleware"]
full = ["mq-bridge/full", "plugin", "rustls-aws-lc", "mimalloc"]
# As `full`, but librdkafka and libsqlite are linked from the environment via
# pkg-config instead of compiled from vendored C sources — the engine's
# `link-dynamic` in place of `link-static`. The two are mutually exclusive, so
# this cannot be layered on top of `full` and has to restate the list.
#
# Not the default: a PyPI wheel has to be self-contained, so `default = ["full"]`
# stays static and this is opt-in. The feature list maturin passes to cargo
# comes from `[tool.maturin] features` in pyproject.toml, so a packager selects
# this by replacing that list:
#
#   [tool.maturin]
#   features = ["pyo3/extension-module", "full-dynamic", "schema"]
#
# plus `--no-default-features` in MATURIN_PEP517_ARGS — without it `full`
# arrives with the default and collides with `link-dynamic`. Naming this
# feature rather than spelling out `mq-bridge/full-dynamic` + `plugin` +
# `rustls-aws-lc` + `mimalloc` is the point: the list cannot drift from `full`.
full-dynamic = ["mq-bridge/full-dynamic", "plugin", "rustls-aws-lc", "mimalloc"]
# mimalloc as Rust-side global allocator. Only redirects allocations made by
# this cdylib's Rust code; CPython's own allocator is untouched. Safe here
# because no raw Rust-allocated buffer crosses the extension boundary.
# Excluded from `basic`, which also builds for musl.
mimalloc = ["dep:mimalloc"]
# All-platform set for the `mq-bridge-py-basic` wheel: the endpoints from
# `mq-bridge/portable` that build across native OS targets without a special
# toolchain, incl. musl/Alpine. amqp + aws pull aws-lc-sys (BoringSSL C), so
# the whole wheel uses the aws-lc crypto provider (same as `full`); aws-lc-sys
# compiles fine natively on musl given cmake + gcc in the build container (see
# before-script-linux in publish-python.yml). The old "ring-only / no aws-lc"
# split was a cross-compile concern, not a native-musl one. memory + file
# endpoints are always compiled.
# Deliberately excluded (full wheel only) — genuinely hard native deps:
#   - kafka   -> rdkafka/librdkafka C toolchain (SASL/SSL/zstd)
#   - sqlx    -> libsqlite3-sys (C, needs bundled sqlite)
#   - grpc    -> build-time protoc binary (glibc-only, fails under musl) + slow build
#   - ibm-mq-static -> IBM MQ proprietary C client linked at build (SDK needed)
# `middleware` is intentionally excluded (metrics + sled dedup are not needed in
# production wheels; retry/DLQ are not feature-gated and remain available).
basic = ["mq-bridge/portable", "plugin", "rustls-aws-lc"]
dedup = ["mq-bridge/dedup"]
metrics = ["mq-bridge/metrics"]
# Load endpoints from native plugin libraries via `mq_bridge.load_endpoint_plugin`.
plugin = ["mq-bridge/plugin"]
# Compatibility alias: config_schema is part of the public Python API and is
# always compiled.
schema = []
test-utils = ["mq-bridge/test-utils"]
kafka = ["mq-bridge/kafka"]
amqp = ["mq-bridge/amqp"]
nats = ["mq-bridge/nats"]
mongodb = ["mq-bridge/mongodb"]
mqtt = ["mq-bridge/mqtt"]
http = ["mq-bridge/http"]
websocket = ["mq-bridge/websocket"]
aws = ["mq-bridge/aws"]
# Runtime-loaded IBM MQ client (dlopen): wheel builds without the IBM SDK; the
# redistributable client is only needed at runtime. Already pulled in by `full`;
# exposed here for explicit opt-in.
ibm-mq = ["mq-bridge/ibm-mq"]
# Static-link IBM MQ client (needs the IBM SDK at build time).
ibm-mq-static = ["mq-bridge/ibm-mq-static"]
zeromq = ["mq-bridge/zeromq"]
redis-streams = ["mq-bridge/redis-streams"]
grpc = ["mq-bridge/grpc"]
sqlx = ["mq-bridge/sqlx"]
rustls-ring = ["dep:rustls", "rustls/ring", "mq-bridge/rustls-ring"]
rustls-aws-lc = ["dep:rustls", "rustls/aws_lc_rs", "rustls/prefer-post-quantum", "mq-bridge/rustls-aws-lc"]

[lints]
workspace = true
